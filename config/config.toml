[report]
timezone = "Asia/Taipei"
title = "F1台股盤前戰情早報"
prompt = "請依照我的 MorningAI Skill，根據以下晨報內容產生 LINE 圖卡。所有數字須忠於原文，不得臆測缺漏資料。"

[network]
timeout_seconds = 15
user_agent = "MorningAI/0.1 (+https://github.com/hahabao-tw/MorningAI)"

[sources]
yahoo_enabled = true
twse_enabled = true
rss_enabled = true
yahoo_news_enabled = true
taifex_enabled = false
mops_enabled = false
stockq_enabled = true
yahoo_future_enabled = true
market_dashboard_enabled = true

[symbols]
"^IXIC" = "NASDAQ"
"^SOX" = "費城半導體"
"^GSPC" = "S&P 500"
"^DJI" = "道瓊指數"
"TSM" = "台積電 ADR"
"UMC" = "聯電 ADR"
"ASX" = "日月光 ADR"
"GC=F" = "黃金"
"CL=F" = "WTI 原油"
"BZ=F" = "布蘭特原油"
"TWD=X" = "USD/TWD"
"TWDJPY=X" = "TWD/JPY"

[news]
max_items_per_feed = 5
international_items = 4
domestic_items = 4
translate_international = true
international_url = "https://tw.stock.yahoo.com/rss?category=intl-markets"
domestic_url = "https://tw.stock.yahoo.com/rss?category=tw-market"
feeds = [
  "https://feeds.bbci.co.uk/news/business/rss.xml",
  "https://www.cnbc.com/id/100727362/device/rss/rss.html",
]
