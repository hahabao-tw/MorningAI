</pre></section></main><script>const payload={markdown:"# MorningAI 台股盤前戰情中心\n\n日期：2026-08-13\n更新：2026-08-13T13:06:15+08:00\n\n## 全球市場\n\n- 資料缺漏\n\n## 台股昨日\n\n- 資料缺漏\n\n## 國際新聞\n\n1. 資料缺漏\n\n## 資料狀態\n\n",prompt:"請依照我的 MorningAI Skill，根據以下晨報內容產生 LINE 圖卡。所有數字須忠於原文，不得臆測缺漏資料。\n\n# MorningAI 台股盤前戰情中心\n\n日期：2026-08-13\n更新：2026-08-13T13:06:15+08:00\n\n## 全球市場\n\n- 資料缺漏\n\n## 台股昨日\n\n- 資料缺漏\n\n## 國際新聞\n\n1. 資料缺漏\n\n## 資料狀態\n\n"};document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{const old=button.textContent;try{await navigator.clipboard.writeText(payload[button.dataset.copy]);button.textContent='已複製';}catch(e){const area=document.createElement('textarea');area.value=payload[button.dataset.copy];document.body.append(area);area.select();document.execCommand('copy');area.remove();button.textContent='已複製';}setTimeout(()=>button.textContent=old,1500);}));</script></body></html>
