name: MorningAI daily report

on:
  schedule:
    # GitHub Actions cron uses UTC. 22:30 UTC = 06:30 Asia/Taipei next day.
    - cron: "30 22 * * *"
    # 23:05 UTC = 07:05 Asia/Taipei next day; same-day data is merged without rollback.
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morningai-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh delayed workflow checkout
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate report and site
        run: python run.py
      - name: Save report history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A report docs
          git diff --cached --quiet || git commit -m "chore: update morning report"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
